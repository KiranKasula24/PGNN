[project]
name = "pignn-ml-service"
version = "0.1.0"
description = "Physics-informed mine-subsidence synthetic-data and prediction service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=2.0",
  "pydantic>=2.8",
  "pyarrow>=17.0",
  "torch>=2.14.0",
  "torch-geometric>=2.8.0.post1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pignn"]
